[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license = "MIT"` below;
# 64..76 reject it with "must be: {file} or {text}" at metadata generation.
requires = ["setuptools>=77", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "gradiex"
version = "0.0.4"
description = "A dependency-free feedforward neural network engine in C++, with Python bindings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20",
  "matplotlib>=3.5",
]
authors = [{name = "Snehashish Laskar"}]
license = "MIT"
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/snehashish090/GradieX"

[tool.cibuildwheel]
# 3.9 is the floor declared in [project]; 3.14 is what development happens on.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
# 32-bit targets have no numpy/matplotlib wheels to test against.
skip = "*_i686 *-win32"
build-frontend = "build"

# core/ uses C++20 (<numbers> needs GCC 11+ / Clang 13+). The manylinux2014
# default image ships GCC 10 and cannot build this; _2_28 ships GCC 12+.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# Prove each wheel actually trains before it is published, not just that it
# imports -- and that the plotting layer renders, since matplotlib is a hard
# dependency and a wheel whose plots raise is not a usable wheel.
#
# The check lives in python/wheel_check.py, referenced through the {project}
# placeholder. An inline `python -c "..."` cannot work here: backslash-escaped
# quotes survive /bin/sh but not cmd.exe, so the Windows runners failed the
# command with a SyntaxError. The script needs no nested quoting on any shell,
# and test-command's temporary working directory guarantees `import gradiex`
# resolves to the installed wheel, not the checkout.
test-requires = ["numpy", "matplotlib"]
test-command = 'python "{project}/python/wheel_check.py"'

[tool.cibuildwheel.environment]
MPLBACKEND = "Agg"
